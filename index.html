<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KroxenStudios - KROX Engine</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: system-ui, sans-serif;
}

header {
    max-width: 900px;
    margin: 60px auto;
    padding: 0 20px;
}

h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 600;
}

p {
    color: #aaa;
    line-height: 1.6;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 0 20px 60px;
}

figure {
    margin: 0 0 60px;
}

img {
    width: 100%;
    display: block;
    border-radius: 4px;
}

figcaption {
    margin-top: 12px;
    color: #888;
    font-size: 0.95rem;
}
</style>
</head>
<body>

<header>
    <h1>KroxenStudios</h1>

    <p>
        From the KROX Engine.<br>
        An experimental game engine focused on large-scale landscapes,
        atmosphere and long-distance exploration. 
    </p>
</header>

<main>

    <figure>
        <img src="images/01.png" alt="">
        <figcaption>Golden Hour</figcaption>
    </figure>

    <figure>
        <img src="images/02.png" alt="">
        <figcaption></figcaption>
    </figure>

    <figure>
        <img src="images/03.png" alt="">
        <figcaption>Distant Horizons</figcaption>
    </figure>

    <figure>
        <img src="images/04.png" alt="">
        <figcaption>Water</figcaption>
    </figure>
<footer>
    Pictures: 25.10-27.10.2026
</footer>
